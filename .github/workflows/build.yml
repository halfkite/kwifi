name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        env:
          ZIG_VERSION: '0.16.0'
        run: |
          $ErrorActionPreference = 'Stop'
          $index = Invoke-RestMethod 'https://ziglang.org/download/index.json'
          $ver = $env:ZIG_VERSION
          $entry = $index.$ver.'x86_64-windows'
          if (-not $entry) { throw "zig $ver for x86_64-windows not found" }
          Invoke-WebRequest $entry.tarball -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter 'zig*' | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $dir.FullName
          & (Join-Path $dir.FullName 'zig.exe') version

      - name: Build kwifi.exe
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File native\build.ps1 -RebuildHelper
          if (-not (Test-Path kwifi.exe)) { throw 'kwifi.exe was not produced' }

      - name: Show fingerprint
        run: |
          $h = (Get-FileHash kwifi.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item kwifi.exe).Length
          $vi = (Get-Item kwifi.exe).VersionInfo
          "size   : $size bytes"
          "sha256 : $h"
          "product: $($vi.ProductName) $($vi.FileVersion)"
          "signed : $((Get-AuthenticodeSignature kwifi.exe).Status)"

      - name: Package
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content VERSION -Raw).Trim()
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $name = "kwifi-$v-$sha.exe"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item kwifi.exe "out\$name"
          $hash = (Get-FileHash "out\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "out\$name.sha256"
          "asset=$name" >> $env:GITHUB_OUTPUT
          Write-Host "$hash  $name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: out/*
          if-no-files-found: error



