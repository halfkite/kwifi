name: release

# Push a tag to publish a release.
#
# Assets are just the one executable, named with its version, e.g.
# kwifi-0.6.0.exe. GitHub adds the source archives automatically.
#
# If the SignPath variables below are configured, the exe is signed first;
# otherwise it is published unsigned (still fully functional).
#
# Configuration (Settings → Secrets and variables → Actions):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
#   variable SIGNPATH_PROJECT_SLUG
#   variable SIGNPATH_SIGNING_POLICY_SLUG
#   variable SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
#
# See docs/SIGNING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          $tag = '${{ github.ref_name }}'
          $version = ($tag -replace '^v', '')
          if (-not $version -or $version -eq 'main') {
            $version = (Get-Content VERSION -Raw).Trim()
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version: $version"

      - name: Install zig
        env:
          ZIG_VERSION: '0.16.0'
        run: |
          $ErrorActionPreference = 'Stop'
          $index = Invoke-RestMethod 'https://ziglang.org/download/index.json'
          $ver = $env:ZIG_VERSION
          $entry = $index.$ver.'x86_64-windows'
          if (-not $entry) { throw "zig $ver for x86_64-windows not found" }
          Invoke-WebRequest $entry.tarball -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter 'zig*' | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $dir.FullName
          & (Join-Path $dir.FullName 'zig.exe') version

      - name: Build
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.ver.outputs.version }}'
          & powershell -NoProfile -ExecutionPolicy Bypass -File native\build.ps1 -Version $v -RebuildHelper
          if (-not (Test-Path kwifi.exe)) { throw 'kwifi.exe was not produced' }

      - name: Name the artifact
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item kwifi.exe "stage\kwifi-$v.exe"
          $hash = (Get-FileHash "stage\kwifi-$v.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "stage\kwifi-$v.exe").Length
          "asset=kwifi-$v.exe" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          Write-Host "$hash  kwifi-$v.exe  ($size bytes)"

      - name: Upload for signing
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: kwifi-unsigned
          path: stage/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect
        id: collect
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.ver.outputs.version }}'
          $name = "kwifi-$v.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null

          if (Test-Path signed) {
            $signed = Get-ChildItem signed -Filter *.exe -Recurse | Select-Object -First 1
            if ($signed) {
              Copy-Item $signed.FullName "release\$name" -Force
              Write-Host "using signed build"
            }
          }
          if (-not (Test-Path "release\$name")) {
            Copy-Item "stage\$name" "release\$name"
            Write-Host 'publishing unsigned build'
          }

          $sig = (Get-AuthenticodeSignature "release\$name").Status
          $hash = (Get-FileHash "release\$name" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "release\$name").Length
          "asset=$name" >> $env:GITHUB_OUTPUT
          "signature=$sig" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          Write-Host "signature: $sig"
          Write-Host "sha256   : $hash"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $v = '${{ steps.ver.outputs.version }}'
          $file = "release\kwifi-$v.exe"
          $size = '${{ steps.collect.outputs.size }}'
          $hash = '${{ steps.collect.outputs.sha256 }}'
          $sig  = '${{ steps.collect.outputs.signature }}'

          $notes = @"
          Windows 热点控制台，单个可执行文件，无需安装任何运行时。

          | | |
          |---|---|
          | 文件 | ``kwifi-$v.exe`` |
          | 大小 | $size 字节 |
          | SHA-256 | ``$hash`` |
          | 签名 | $sig |

          **使用**：下载后双击运行。控制热点需要管理员权限，UAC 弹窗点「是」。
          这是单文件程序，不用安装，放到任意文件夹即可；配置和日志写在 ``%LOCALAPPDATA%\Kwifi\data``。

          未签名的版本 Windows 会显示「未知发布者」，可用上面的 SHA-256 核对文件完整性。
          "@
          gh release create $tag --title "kwifi $tag" --notes $notes $file
      - name: Upload signed build
        if: ${{ steps.collect.outputs.signature == 'Valid' }}
        uses: actions/upload-artifact@v4
        with:
          name: kwifi-signed
          path: release/*.exe


